[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sciagent-cli"
version = "0.1.0"
description = "Thin command-line entrypoint for sciagent"
requires-python = ">=3.12"
dependencies = [
  "sciagent-components>=0.1,<0.2",
  "sciagent-capabilities>=0.1,<0.2",
  "sciagent-contracts>=0.1,<0.2",
  "sciagent-executor>=0.1,<0.2",
  "sciagent-orchestrator>=0.1,<0.2",
  "sciagent-runtime>=0.1,<0.2",
  "sciagent-scientific>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
sciagent = "sciagent_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
