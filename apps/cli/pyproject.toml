[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resagent2-cli"
version = "0.1.0"
description = "Thin command-line entrypoint for ResAgent2"
requires-python = ">=3.12"
dependencies = [
  "resagent2-components>=0.1,<0.2",
  "resagent2-capabilities>=0.1,<0.2",
  "resagent2-contracts>=0.1,<0.2",
  "resagent2-executor>=0.1,<0.2",
  "resagent2-orchestrator>=0.1,<0.2",
  "resagent2-runtime>=0.1,<0.2",
  "resagent2-scientific>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
resagent2 = "resagent2_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
