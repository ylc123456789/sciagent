[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resagent2-components"
version = "0.1.0"
description = "Reusable operations and result presentation for ResAgent2"
requires-python = ">=3.12"
dependencies = [
  "tree-sitter-bash==0.25.1",
  "tree-sitter==0.26.0",
  "beautifulsoup4>=4.15,<5",
  "defusedxml>=0.7,<0.8",
  "markdownify>=1.2.3,<1.3",
  "pymupdf4llm>=1.28.2,<1.29",
  "pydantic>=2.12,<3",
  "resagent2-contracts>=0.1,<0.2",
  "resagent2-runtime>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
