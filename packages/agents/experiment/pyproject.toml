[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sciagent-experiment"
version = "0.1.0"
description = "Experiment execution preset entry for sciagent"
requires-python = ">=3.12"
dependencies = ["sciagent-executor>=0.1,<0.2"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
