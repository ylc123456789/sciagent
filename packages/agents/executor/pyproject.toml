[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sciagent-executor"
version = "0.1.0"
description = "Configurable execution Agent and trusted presets for sciagent"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
  "sciagent-components>=0.1,<0.2",
  "sciagent-capabilities>=0.1,<0.2",
  "sciagent-contracts>=0.1,<0.2",
  "sciagent-runtime>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
