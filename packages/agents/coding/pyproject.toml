[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resagent2-coding"
version = "0.1.0"
description = "Coding execution preset entry for ResAgent2"
requires-python = ">=3.12"
dependencies = ["resagent2-executor>=0.1,<0.2"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
